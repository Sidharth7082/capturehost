# CaptureHost — local development stack.
#
# The backend NEVER sees /var/run/docker.sock. Only this proxy container mounts
# it, and the mount is read-only. The proxy exposes a hand-picked subset of the
# Docker HTTP API so a bug in the dashboard cannot reach the parts we do not use
# (exec into containers, secrets, swarm, plugins, system prune, build...).
#
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down

services:
  # Compose only creates a network that some service references, and the proxy
  # must stay off it, so this one-shot container exists purely to bring the
  # network into existence. It runs `true` and exits; `restart: "no"` keeps it
  # out of the way.
  network-init:
    image: alpine:3.20
    container_name: capturehost-network-init
    command: ["true"]
    restart: "no"
    networks:
      - capturehost-apps

  docker-socket-proxy:
    # Pinned: an unpinned proxy silently changes what it allows.
    image: tecnativa/docker-socket-proxy:0.2.0
    container_name: capturehost-socket-proxy
    restart: unless-stopped

    environment:
      # ---- enabled: the minimum the dashboard actually needs --------------
      # CONTAINERS: list, inspect, start, stop, restart and remove containers.
      #             This is the whole feature set of Phase 3.
      CONTAINERS: 1
      # IMAGES:     container inspect includes image metadata; without this the
      #             repo tags and sizes come back empty.
      IMAGES: 1
      # INFO:       GET /version and /info — shown in the "engine version" card
      #             and used to prove the engine is reachable.
      INFO: 1
      # EVENTS:     read-only event stream. Used to notice a container dying
      #             between two polls instead of waiting for the next one.
      EVENTS: 1
      # PING:       GET /_ping — the cheapest possible health probe.
      PING: 1
      # POST:       every mutating call is a POST or a DELETE at the HTTP level
      #             (start/stop/restart/remove). Without it the dashboard is
      #             read-only. It is still scoped by the flags above: POST on
      #             /exec, /build or /volumes stays closed.
      POST: 1
      # BUILD:      Phase 4 builds images from a cloned Dockerfile. Needed for
      #             POST /build. Note this proxy filters by URL (and method),
      #             NOT by request body: the build context and the container
      #             create options are whatever the backend sends. That is why
      #             the backend enforces a container safety policy itself
      #             (services/containerPolicy.ts) instead of trusting the proxy.
      BUILD: 1

      # ---- explicitly closed -------------------------------------------
      EXEC: 0 #      no shell inside containers (the classic privilege escalation)
      VOLUMES: 0 #   no creating/deleting host volumes
      NETWORKS: 0 #  no rewiring host networking — the app network is created by
                  # this compose file, not through the API
      SECRETS: 0 #   no docker secrets
      SERVICES: 0 #  no swarm services
      SWARM: 0 #     no swarm at all
      AUTH: 0 #      no /auth (registry credentials)
      COMMIT: 0 #    no committing containers to images
      CONFIGS: 0 #   no docker configs
      PLUGINS: 0 #   no plugin installs
      SYSTEM: 0 #    no /system endpoints — prune lives here
      TASKS: 0 #     no swarm tasks
      NODES: 0 #     no swarm nodes
      # SESSION / GRPC stay closed: those are BuildKit. We use dockerode's
      # classic buildImage, which goes through POST /build.
      SESSION: 0
      GRPC: 0

    volumes:
      # Read-only: the proxy reads the socket, it must never rewrite the file.
      - /var/run/docker.sock:/var/run/docker.sock:ro

    ports:
      # Loopback only. Publishing on 0.0.0.0 would expose a password-less
      # Docker API to the network — that is root on the host.
      - "127.0.0.1:2375:2375"

    labels:
      # The dashboard must never offer to stop the thing that gives it Docker
      # access. Enforced again in the backend, not just hidden in the UI.
      capturehost.protected: "true"

# Deployed apps attach to this network. It is created by compose, by this file,
# never through the Docker API (the proxy keeps NETWORKS=0), so a project cannot
# rewire networking.
#
# The proxy is deliberately NOT on this network: an app container must never be
# able to reach the (unauthenticated) Docker API proxy sitting next to it.
networks:
  capturehost-apps:
    name: capturehost-apps
    driver: bridge

