<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="CaptureHost">
  <title>CaptureHost</title>
  <!--
    CaptureHost mark: two arms and a middle bar around a lens. Measured off
    docs/brand/logo-source.jpg and assests/Favicon set.jpg (see PROGRESS.md 63).
    Gradient #6366f1 -> #8b5cf6, lens off-white, holes cut out of each bar.
  -->
  <defs>
    <linearGradient id="ch-head-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <mask id="ch-head-mask">
      <g fill="#fff">
    <rect x="149.5" y="104" width="131.5" height="89" />
    <circle cx="157.5" cy="148.5" r="44.5" />
    <rect x="269" y="104" width="95" height="68" />
    <circle cx="364" cy="138.0" r="34" />
    <rect x="157.5" y="320" width="131.5" height="88" />
    <circle cx="157.5" cy="364.0" r="44.5" />
    <rect x="269" y="340" width="95" height="68" />
    <circle cx="364" cy="374.0" r="34" />
    <rect x="149" y="212" width="151" height="88" />
    <circle cx="157" cy="256.0" r="44" />
      </g>
      <circle cx="312" cy="256" r="84" fill="#000" />
    <g fill="#000">
    <circle cx="157" cy="148.5" r="8.8" />
    <circle cx="198" cy="148.5" r="8.8" />
    <circle cx="157" cy="256.0" r="8.8" />
    <circle cx="198" cy="256.0" r="8.8" />
    <circle cx="157" cy="364.0" r="8.8" />
    <circle cx="198" cy="364.0" r="8.8" />
    </g>
    </mask>
  </defs>

  <rect width="1200" height="320" rx="28" fill="#161e31" />
  <rect x="1" y="1" width="1198" height="318" rx="27" fill="none" stroke="#252b42" stroke-width="2" />
  <g transform="translate(64 26.88) scale(0.52)">
    <rect x="96" y="96" width="320" height="320" fill="url(#ch-head-grad)" mask="url(#ch-head-mask)" />
    <circle cx="312" cy="256" r="40" fill="#f5f5f7" />
  </g>
  <text x="352" y="150" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="78" font-weight="600" letter-spacing="-2"><tspan fill="#e8eaf2">Capture</tspan><tspan fill="#8b93ff">Host</tspan></text>
  <text x="354" y="206" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="25" fill="#8b91a3">Monitor, deploy, route and back up — all from one laptop</text>
</svg>
